[package]
name = "sloth-lang-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["nan-boxing"]
# Store values in a single NaN-boxed 64 bit word instead of the default
# tagged-union enum.
nan-boxing = []

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
raylib = "5.0.2"

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "fib_bench"
harness = false
